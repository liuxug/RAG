<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - RAG 知识库</title>
    <style id="theme-vars">
/* ===== RAG Document System - Brand Design Tokens ===== */
:root {
  /* ── Color System ── */
  --color-primary: #2B5EA7;
  --color-primary-hover: #1E4A8A;
  --color-primary-light: #E8F0FA;
  --color-primary-subtle: #F0F5FC;

  --color-bg: #F5F7FA;
  --color-bg-secondary: #FFFFFF;
  --color-bg-tertiary: #EEF1F6;
  --color-bg-hover: #F0F2F7;

  --color-text-primary: #1A2332;
  --color-text-secondary: #5A6B7F;
  --color-text-tertiary: #8C96A3;
  --color-text-inverse: #FFFFFF;

  --color-border: #DDE3EB;
  --color-border-light: #E8ECF1;
  --color-divider: #F0F2F5;

  /* State colors */
  --state-success: #2D9B6E;
  --state-warning: #D4930D;
  --state-error: #D04848;
  --state-info: #2B5EA7;

  /* Tag/category colors */
  --tag-tech: #E8F0FA;
  --tag-tech-text: #2B5EA7;
  --tag-hr: #FEF3E2;
  --tag-hr-text: #B8860B;
  --tag-finance: #E8F8F0;
  --tag-finance-text: #2D9B6E;
  --tag-legal: #F0ECF8;
  --tag-legal-text: #6B4FA2;
  --tag-general: #F0F2F5;
  --tag-general-text: #5A6B7F;

  /* ── Typography ── */
  --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-family-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --font-size-2xl: 30px;
  --font-size-3xl: 36px;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;

  --letter-spacing-tight: -0.02em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide: 0.02em;

  /* ── Spacing ── */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 48px;
  --space-4xl: 64px;

  /* ── Radius ── */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* ── Shadows (static surfaces use border-first; floating layers only) ── */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.05);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.10);

  /* ── Transitions ── */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;

  /* ── Z-index ── */
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-modal-backdrop: 300;
  --z-modal: 400;
  --z-toast: 500;
}

/* ── Dark Mode ── */
html.dark {
  --color-primary: #5B8FD4;
  --color-primary-hover: #7AA8E5;
  --color-primary-light: #1A2F4A;
  --color-primary-subtle: #15263E;

  --color-bg: #0F1419;
  --color-bg-secondary: #1A2332;
  --color-bg-tertiary: #243042;
  --color-bg-hover: #1E2B3D;

  --color-text-primary: #E8ECF1;
  --color-text-secondary: #A0AEBE;
  --color-text-tertiary: #6B7B8D;
  --color-text-inverse: #1A2332;

  --color-border: #2D3B4E;
  --color-border-light: #243042;
  --color-divider: #1E2B3D;

  --state-success: #3CB371;
  --state-warning: #E6A817;
  --state-error: #E05555;
  --state-info: #5B8FD4;

  --tag-tech: #1A2F4A;
  --tag-tech-text: #5B8FD4;
  --tag-hr: #2E2410;
  --tag-hr-text: #E6A817;
  --tag-finance: #152E22;
  --tag-finance-text: #3CB371;
  --tag-legal: #1E1A2E;
  --tag-legal-text: #9B7FD4;
  --tag-general: #1E2B3D;
  --tag-general-text: #A0AEBE;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.4);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen flex">
      <!-- Left Panel: Brand Area -->
      <aside class="hidden lg:flex lg:w-[60%] flex-col items-center justify-center relative" style="background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-hover) 100%);">
        <div class="flex flex-col items-center max-w-md px-8 text-center">
          <!-- Logo Icon -->
          <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-8" style="background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);">
            <i data-lucide="file-search" class="w-8 h-8" style="color: var(--color-text-inverse);"></i>
          </div>
          <!-- Brand Name -->
          <h1 class="text-3xl font-bold mb-3" style="color: var(--color-text-inverse); font-family: var(--font-family);">RAG 知识库</h1>
          <!-- Tagline -->
          <p class="text-base mb-12" style="color: rgba(255,255,255,0.7); font-family: var(--font-family);">创建账户，开启智能知识管理之旅</p>
          <!-- Feature Bullets -->
          <div class="flex flex-col gap-5 w-full max-w-xs">
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0" style="background: rgba(255,255,255,0.2);">
                <i data-lucide="check" class="w-3 h-3" style="color: var(--color-text-inverse);"></i>
              </div>
              <span class="text-sm" style="color: rgba(255,255,255,0.85); font-family: var(--font-family);">免费注册，即刻体验全部功能</span>
            </div>
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0" style="background: rgba(255,255,255,0.2);">
                <i data-lucide="check" class="w-3 h-3" style="color: var(--color-text-inverse);"></i>
              </div>
              <span class="text-sm" style="color: rgba(255,255,255,0.85); font-family: var(--font-family);">支持多种企业邮箱快速验证</span>
            </div>
            <div class="flex items-center gap-3">
              <div class="w-5 h-5 rounded-full flex items-center justify-center shrink-0" style="background: rgba(255,255,255,0.2);">
                <i data-lucide="check" class="w-3 h-3" style="color: var(--color-text-inverse);"></i>
              </div>
              <span class="text-sm" style="color: rgba(255,255,255,0.85); font-family: var(--font-family);">安全可靠的企业级数据保护</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right Panel: Register Form -->
      <section class="w-full lg:w-[40%] flex items-center justify-center py-12 px-6" style="background: var(--color-bg-secondary);">
        <div class="w-full max-w-[400px]">
          <!-- Header -->
          <div class="mb-8">
            <h2 class="text-2xl font-semibold mb-2" style="color: var(--color-text-primary); font-family: var(--font-family);">创建账户</h2>
            <p class="text-sm" style="color: var(--color-text-secondary); font-family: var(--font-family);">请填写以下信息完成注册</p>
          </div>

          <!-- Register Form -->
          <form class="flex flex-col gap-5" onsubmit="return false;">
            <!-- 用户名 -->
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium" style="color: var(--color-text-primary); font-family: var(--font-family);">用户名</label>
              <div class="relative flex items-center">
                <div class="absolute left-3 flex items-center pointer-events-none">
                  <i data-lucide="user" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                </div>
                <input type="text" placeholder="请设置用户名（4-20位字母或数字）" class="w-full h-[42px] pl-10 pr-4 text-sm outline-none transition-colors" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-secondary); color: var(--color-text-primary); font-family: var(--font-family);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" />
              </div>
              <p class="text-xs" style="color: var(--color-text-tertiary); font-family: var(--font-family);">用户名设置后不可修改</p>
            </div>

            <!-- 邮箱 -->
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium" style="color: var(--color-text-primary); font-family: var(--font-family);">邮箱地址</label>
              <div class="relative flex items-center">
                <div class="absolute left-3 flex items-center pointer-events-none">
                  <i data-lucide="mail" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                </div>
                <input type="email" placeholder="请输入企业邮箱地址" class="w-full h-[42px] pl-10 pr-4 text-sm outline-none transition-colors" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-secondary); color: var(--color-text-primary); font-family: var(--font-family);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" />
              </div>
            </div>

            <!-- 邮箱验证码 -->
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium" style="color: var(--color-text-primary); font-family: var(--font-family);">邮箱验证码</label>
              <div class="flex items-center gap-3">
                <div class="relative flex-1 flex items-center">
                  <div class="absolute left-3 flex items-center pointer-events-none">
                    <i data-lucide="shield-check" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                  </div>
                  <input type="text" placeholder="请输入验证码" class="w-full h-[42px] pl-10 pr-4 text-sm outline-none transition-colors" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-secondary); color: var(--color-text-primary); font-family: var(--font-family);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" />
                </div>
                <button type="button" class="shrink-0 h-[42px] px-4 text-sm font-medium whitespace-nowrap transition-colors" style="border: 1px solid var(--color-primary); border-radius: var(--radius-md); background: var(--color-bg-secondary); color: var(--color-primary); font-family: var(--font-family);">获取验证码</button>
              </div>
            </div>

            <!-- 密码 -->
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium" style="color: var(--color-text-primary); font-family: var(--font-family);">密码</label>
              <div class="relative flex items-center">
                <div class="absolute left-3 flex items-center pointer-events-none">
                  <i data-lucide="lock" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                </div>
                <input type="password" placeholder="请设置密码（至少8位）" class="w-full h-[42px] pl-10 pr-10 text-sm outline-none transition-colors" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-secondary); color: var(--color-text-primary); font-family: var(--font-family);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" />
                <button type="button" class="absolute right-3 flex items-center pointer-events-auto">
                  <i data-lucide="eye-off" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                </button>
              </div>
              <!-- Password Strength Indicator -->
              <div class="flex items-center gap-1.5 mt-1">
                <div class="h-1 flex-1 rounded-full" style="background: var(--color-border-light);">
                  <div class="h-full w-0 rounded-full" style="background: var(--state-error);"></div>
                </div>
                <div class="h-1 flex-1 rounded-full" style="background: var(--color-border-light);">
                  <div class="h-full w-full rounded-full" style="background: var(--state-warning);"></div>
                </div>
                <div class="h-1 flex-1 rounded-full" style="background: var(--color-border-light);">
                  <div class="h-full w-0 rounded-full" style="background: var(--state-success);"></div>
                </div>
                <span class="text-xs ml-2" style="color: var(--state-warning); font-family: var(--font-family);">中</span>
              </div>
              <p class="text-xs" style="color: var(--color-text-tertiary); font-family: var(--font-family);">需包含字母和数字</p>
            </div>

            <!-- 确认密码 -->
            <div class="flex flex-col gap-1.5">
              <label class="text-sm font-medium" style="color: var(--color-text-primary); font-family: var(--font-family);">确认密码</label>
              <div class="relative flex items-center">
                <div class="absolute left-3 flex items-center pointer-events-none">
                  <i data-lucide="lock" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                </div>
                <input type="password" placeholder="请再次输入密码" class="w-full h-[42px] pl-10 pr-10 text-sm outline-none transition-colors" style="border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-secondary); color: var(--color-text-primary); font-family: var(--font-family);" onfocus="this.style.borderColor='var(--color-primary)'" onblur="this.style.borderColor='var(--color-border)'" />
                <button type="button" class="absolute right-3 flex items-center pointer-events-auto">
                  <i data-lucide="eye-off" class="w-4 h-4" style="color: var(--color-text-tertiary);"></i>
                </button>
              </div>
            </div>

            <!-- Agreement Checkbox -->
            <div class="flex items-start gap-2.5 mt-1">
              <input type="checkbox" class="mt-0.5 shrink-0 w-4 h-4 rounded" style="accent-color: var(--color-primary);" />
              <p class="text-xs leading-relaxed" style="color: var(--color-text-secondary); font-family: var(--font-family);">
                我已阅读并同意<a href="#" class="font-medium" style="color: var(--color-primary);">《用户服务协议》</a>和<a href="#" class="font-medium" style="color: var(--color-primary);">《隐私政策》</a>
              </p>
            </div>

            <!-- Register Button -->
            <button type="submit" class="w-full h-[44px] text-sm font-semibold tracking-wider transition-colors mt-2" style="background: var(--color-primary); color: var(--color-text-inverse); border-radius: var(--radius-md); font-family: var(--font-family);" onmouseover="this.style.background='var(--color-primary-hover)'" onmouseout="this.style.background='var(--color-primary)'">
              注 册
            </button>
          </form>

          <!-- Footer -->
          <div class="flex items-center justify-center gap-1 mt-6 text-sm" style="color: var(--color-text-secondary); font-family: var(--font-family);">
            <span>已有账户？</span>
            <a href="page-login" data-dom-id="goto-login" class="font-medium" style="color: var(--color-primary);">立即登录</a>
          </div>
        </div>
      </section>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
